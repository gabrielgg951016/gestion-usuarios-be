spring:
  application:
    name: gestion-usuarios-be
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_POSTGRES_LOCAL_URL}/${DB_POSTGRES_LOCAL_NAME}
    username: ${DB_POSTGRES_LOCAL_USERNAME}
    password: ${DB_POSTGRES_LOCAL_PASSWORD}
  jpa:
    ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        temp:
          use_jdbc_metadata_defaults: false

server:
  port: ${SERVER_PORT}
